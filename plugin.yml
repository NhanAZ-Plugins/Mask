name: Mask
main: Mask\Main
version: 3.0.0
api: 5.0.0
load: POSTWORLD
author: Ghast Noob
description: Rotates a decorative mob head as a player's mask while preserving their original helmet.
commands:
  mask:
    description: Toggle the decorative mask and restore the saved helmet safely.
    permission: "mask.command"
permissions:
  mask.command:
    description: Allows using /mask on and /mask off.
    default: op
